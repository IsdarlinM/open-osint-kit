[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-osint-kit"
version = "1.3.0"
description = "Cross-platform OSINT toolkit for authorized research using public sources"
requires-python = ">=3.9"
dependencies = ["phonenumbers>=8.13"]

[project.scripts]
osint-kit = "osint:main"

[tool.setuptools]
py-modules = ["osint"]