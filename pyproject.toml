[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-osint-kit"
version = "1.0.2"
description = "Kit OSINT multiplataforma para investigaciones autorizadas con fuentes públicas"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
osint-kit = "osint:main"

[tool.setuptools]
py-modules = ["osint"]