[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-osint-kit"
version = "1.1.1"
description = "Kit OSINT multiplataforma para investigaciones autorizadas con fuentes públicas"
requires-python = ">=3.9"
dependencies = ["phonenumbers>=8.13"]

[project.scripts]
osint-kit = "osint:main"

[tool.setuptools]
py-modules = ["osint"]